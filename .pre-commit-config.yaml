repos:
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: npx prettier --check
        language: system
        types_or: [javascript, jsx, ts, tsx, json, css, markdown, yaml]
      - id: eslint
        name: eslint
        entry: npm run lint --
        language: system
        files: \.[jt]sx?$
        pass_filenames: false
      - id: typecheck
        name: typecheck
        entry: npm run typecheck
        language: system
        files: \.(ts|json)$
        pass_filenames: false

default_stages: [pre-commit, pre-push]
